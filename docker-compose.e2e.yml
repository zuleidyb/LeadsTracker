name: leadstracker-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadstracker
      POSTGRES_USER: leads_app
      POSTGRES_PASSWORD: leads_dev_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads_app -d leadstracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/LeadsTracker.Api/Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=leadstracker;Username=leads_app;Password=leads_dev_password
      RunMigrations: "true"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8088:80"
    depends_on:
      - api
